# ---Colors---
source = ./conf/colors-hyprland.conf

# Font Family
$font = JetBrainsMono Nerd Font Propo Semi-Bold

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/eww/icons/user.face.icon
    border_size = 3
    border_color = $primary $tertiary 135deg 
    size = 150
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 40
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $on_background
    font_size = 120
    font_family = $font
    position = 0, 325
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "<i>$(date +"%A, %B %d")</i>"
    color = $on_background
    font_size = 25
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = $primary_container
    rounding = -1
    border_size = 3
    border_color = $tertiary $primary 45deg 
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -130
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   $USER
    color = $on_primary_container
    font_size = 18
    font_family = $font
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $primary $tertiary 45deg
    inner_color = $secondary_container
    font_color = $on_secondary_container
    check_color = $source_color $inverse_primary 90deg
    fail_color = $on_error_container $on_error 135deg
    fade_on_empty = false
    font_family = $font
    placeholder_text = <i>  Enter Pass</i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}