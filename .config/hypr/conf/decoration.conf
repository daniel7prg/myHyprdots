#  _____________
# | Decorations |
#  -------------

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    screen_shader = ~/.config/hypr/shaders/nightMode.frag
    active_opacity = 0.93
    dim_inactive = true
    dim_strength = 0.3

    blur {
        enabled = true
        xray = false
        new_optimizations = true
        size = 7
        passes = 3
        brightness = 1
        contrast = 1
        popups = false
        popups_ignorealpha = 0.5
    }

    shadow{
        enabled = true
        range = 15
        render_power = 3
        color = rgb(292929)
        offset = 0 0
    }

}
