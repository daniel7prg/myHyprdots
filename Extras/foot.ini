title=foot

font=JetBrainsMono Nerd Font:size=18
letter-spacing=0
dpi-aware=no

pad=25x25

bold-text-in-bright=no

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5

[colors]
foreground='{{colors.on_background.default.hex_stripped}}'
background='{{colors.background.default.hex_stripped}}'
regular0='{{colors.background.default.hex_stripped}}'
regular1='{{colors.primary.default.hex_stripped}}'
regular2='{{colors.primary.default.hex_stripped | auto_lightness: 10.0}}'
regular3='{{colors.secondary.default.hex_stripped}}'
regular4='{{colors.secondary.default.hex_stripped | auto_lightness: 10.0}}'
regular5='{{colors.tertiary.default.hex_stripped}}'
regular6='{{colors.tertiary.default.hex_stripped | auto_lightness: 10.0}}'
regular7='{{colors.on_background.default.hex_stripped}}'
bright0='{{colors.outline.default.hex_stripped}}'
bright1='{{colors.primary.default.hex_stripped}}'
bright2='{{colors.primary.default.hex_stripped | auto_lightness: 10.0}}'
bright3='{{colors.secondary.default.hex_stripped}}'
bright4='{{colors.secondary.default.hex_stripped | auto_lightness: 10.0}}'
bright5='{{colors.tertiary.default.hex_stripped}}'
bright6='{{colors.tertiary.default.hex_stripped | auto_lightness: 10.0}}'
bright7='{{colors.on_background.default.hex_stripped}}'
foreground='{{colors.outline_variant.default.hex_stripped}}'
background='{{colors.on_primary_container.default.hex_stripped}}'